<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Покер">
<meta name="theme-color" content="#0a0e0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Покерный помощник</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);color-scheme:dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: экран-инструмент — стол сверху, панель действий под большим пальцем. Сознательно одна тёмная тема: игра идёт в полумраке */
:root{
  --bg:#0a0e0c; --panel:#131917; --raised:#1b2320; --line:#26302c; --ink:#eef3f0; --muted:#8d9a94; --dim:#5b6762;
  --felt:#0f2a1f; --felt-edge:#1e4a37;
  --raise:#38d47c; --call:#5ea3ff; --hot:#ff5f63; --fold:#7c8783; --gold:#f2c14e;
  --chip-w:#f1f1ee; --chip-r:#d9363e; --chip-b:#2f6fe8; --chip-g:#24a05c; --chip-k:#1d1f1e;
  --body:"Onest", -apple-system, system-ui, sans-serif; --display:"Unbounded", "Onest", sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--call);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
/* верхняя строка */
.top{display:flex;align-items:center;gap:8px;padding:8px 16px 4px}
.top .info{flex:1;min-width:0;font:600 13px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .info b{color:var(--ink)}
.tbtn{height:36px;padding:0 12px;border-radius:10px;background:var(--raised);font-weight:600;font-size:14px}
/* стол */
.table-wrap{flex:1;min-height:0;position:relative;padding:8px 16px}
.felt{position:absolute;inset:11% 21% 11%;border-radius:28px;background:radial-gradient(ellipse at 50% 40%,#16392a,var(--felt) 70%);border:3px solid var(--felt-edge);box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pot{font:700 13px var(--mono);color:var(--muted)} .pot b{display:block;font:800 22px var(--display);color:var(--ink)}
.hc{display:flex;gap:6px;justify-content:center}
#heroCards{flex-direction:column;align-items:center}
.hc.board .pc{width:34px;height:48px;font-size:16px;border-radius:5px}.hc.board .pc small{font-size:13px}
.pc{width:46px;height:64px;border-radius:7px;background:#fafaf7;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 22px/1 var(--mono);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.pc small{font-size:18px;margin-top:2px}
.pc.s0{color:#111}.pc.s1{color:#d42a32}.pc.s2{color:#1f5fd6}.pc.s3{color:#168a4a}
.pc.empty{background:transparent;border:2px dashed var(--dim);color:var(--dim);box-shadow:none;font-size:13px}
.seat{position:absolute;display:flex;align-items:center;gap:3px}
.seat .meta{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:40px}
.seat.top{flex-direction:column;transform:translate(-50%,-26px)}
.seat.bot{flex-direction:column-reverse;transform:translate(-50%,calc(-100% + 26px))}
.seat.bot .meta{flex-direction:column-reverse}
.seat.lft{flex-direction:row;transform:translate(-26px,-50%)}
.seat.rgt{flex-direction:row-reverse;transform:translate(calc(-100% + 26px),-50%)}
.seat.ghost.top,.seat.ghost.bot,.seat.ghost.lft,.seat.ghost.rgt{transform:translate(-50%,-50%)}
.seat.empty .disc{border:2px dashed var(--dim);background:transparent;color:var(--dim);font:700 22px var(--mono)}
.seat.ghost{pointer-events:none}.seat.ghost .disc{width:18px;height:18px;border:1px dashed var(--line);background:transparent}
.seat .disc{flex:none;width:52px;height:52px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .2s,opacity .2s}
.seat .pos{font:700 12px var(--mono)}
.seat .stk{font:500 10px var(--mono);color:var(--muted)}
.seat.hero .disc{border-color:var(--gold);background:#2a2412}
.seat.folded .disc{opacity:.32}
.seat.away .disc{opacity:.4;border-style:dashed}
.seat.turn .disc{border-color:var(--call);box-shadow:0 0 0 4px rgba(94,163,255,.25);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(94,163,255,.08)}}
.seat .bet{font:700 11px var(--mono);background:rgba(0,0,0,.55);padding:1px 6px;border-radius:8px;min-height:16px}
.seat .bet.r{color:var(--raise)} .seat .bet.c{color:var(--call)}
.seat .act{font:600 10px var(--body);color:var(--muted);height:13px}
.dealer{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;color:#000;font:800 11px var(--mono);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 2px 4px rgba(0,0,0,.6)}
/* нижняя панель */
.dock{background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.who{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.who b{font:800 18px var(--display);color:var(--ink)}
.row{display:flex;gap:8px}
.big{flex:1;height:64px;border-radius:14px;font:700 18px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.big small{font:600 12px var(--mono);opacity:.8;margin-top:3px}
.b-fold{background:#2a3230;color:#d5dbd8} .b-call{background:#163055;color:#cfe3ff} .b-raise{background:#123d27;color:#c7f5da} .b-hot{background:#4a1a1d;color:#ffd5d6}
.b-rec{outline:3px solid var(--ink);outline-offset:-3px}
.small{flex:1;height:44px;border-radius:12px;background:var(--raised);font-weight:600;font-size:14px}
.small.wide{flex:2}
.small:disabled{opacity:.35}
/* выбор карт */
.ranks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ranks button{height:50px;border-radius:12px;background:var(--raised);font:700 20px var(--mono)}
.ranks button.on{background:var(--ink);color:var(--bg)}
.suitsel{display:flex;gap:8px}
.suitsel button{flex:1;height:56px;border-radius:14px;background:var(--raised);font-weight:700;font-size:16px}
/* рекомендация */
.rec{display:flex;flex-direction:column;gap:6px}
.rec .verb{font:800 34px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.rec .verb.raise{color:var(--raise)}.rec .verb.call,.rec .verb.check{color:var(--call)}.rec .verb.allin,.rec .verb.tb{color:var(--hot)}.rec .verb.fold{color:var(--fold)}
.rec .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 13px var(--mono);color:var(--muted)}
.tag{padding:2px 8px;border-radius:8px;font:600 11px var(--body);background:var(--raised)}
.tag.edge{background:#3a3112;color:var(--gold)} .tag.clear{background:#11301f;color:var(--raise)}
.rec .why{font-size:14px;color:#c9d2ce}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--raised);border-radius:12px;padding:8px 10px}
.kpi span{display:block;font-size:11px;color:var(--muted)} .kpi b{font:700 17px var(--mono)}
.chips-ico{display:inline-flex;gap:2px;vertical-align:middle}
.ci{width:14px;height:14px;border-radius:50%;border:2px dashed rgba(255,255,255,.6)}
/* шторки */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:520px;margin:0 auto;background:var(--panel);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h3{margin:0;font:800 18px var(--display)}
.amount{text-align:center} .amount b{display:block;font:800 44px/1 var(--display)} .amount span{font:600 13px var(--mono);color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1 0 22%;height:44px;border-radius:12px;background:var(--raised);font:700 16px var(--mono)}
.chipsrow{display:flex;justify-content:space-between;gap:6px}
.chip{position:relative;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 15px var(--mono);border:5px dashed rgba(255,255,255,.75);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.chip.w{background:var(--chip-w);color:#222;border-color:rgba(0,0,0,.25)} .chip.r{background:var(--chip-r);color:#fff} .chip.b{background:var(--chip-b);color:#fff} .chip.g{background:var(--chip-g);color:#fff} .chip.k{background:var(--chip-k);color:#fff}
.chip i{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--bg);font:700 12px/22px var(--mono);font-style:normal;text-align:center;padding:0 4px}
.err{min-height:18px;font-size:13px;color:var(--hot);text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{height:46px;border-radius:12px;background:var(--raised);font:700 18px var(--mono)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;height:44px;border-radius:12px;background:var(--raised);font:700 15px var(--mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--raised);font:700 20px var(--mono)}
.stepper b{flex:1;text-align:center;font:700 20px var(--mono)}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.li .m{font:600 12px var(--mono);color:var(--muted)}
.res{font:800 30px var(--display)} .res.pos{color:var(--raise)} .res.neg{color:var(--hot)}
.detail{display:flex;flex-direction:column;gap:8px;font-size:14px}
.detail .ln{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.detail .ln span:first-child{color:var(--muted)} .detail .ln span:last-child{font:600 13px var(--mono);text-align:right}
.note{font-size:12px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.seat.turn .disc{animation:none}}
@media (max-height:700px){.big{height:56px}.ranks button{height:44px}}
</style>

<div class="app" id="app">
  <div class="top">
    <div class="info" id="info"></div>
    <button class="tbtn" id="btnSeat" type="button">Стол</button>
    <button class="tbtn" id="btnHist" type="button">Отчёт</button>
    <button class="tbtn" id="btnSess" type="button">Сессия</button>
  </div>
  <div class="table-wrap" id="tableWrap">
    <div class="felt"></div>
    <div class="center"><div class="pot" id="pot"></div><div class="hc" id="heroCards"></div></div>
  </div>
  <div class="dock" id="dock"></div>
</div>
<div id="layer"></div>

// ===== Покерный движок: карты, оценка рук, эквити, вероятности флопа =====
// Карта = число 0..51: ранг = c >> 2 (0 = двойка … 12 = туз), масть = c & 3 (0 ♠, 1 ♥, 2 ♦, 3 ♣)
const RANKS = "23456789TJQKA";
const RANK_ORDER = "AKQJT98765432";
const SUITS = ["♠", "♥", "♦", "♣"];
const card = (r, s) => (RANKS.indexOf(r) << 2) | s;
const cRank = c => c >> 2, cSuit = c => c & 3;
const cName = c => RANKS[cRank(c)] + SUITS[cSuit(c)];

// Класс руки (AKs, AKo, 77) из двух карт
function handClass(c1, c2) {
  let r1 = cRank(c1), r2 = cRank(c2);
  if (r1 < r2) [r1, r2] = [r2, r1];
  if (r1 === r2) return RANKS[r1] + RANKS[r2];
  return RANKS[r1] + RANKS[r2] + (cSuit(c1) === cSuit(c2) ? "s" : "o");
}
// Все конкретные комбинации класса
function combosOf(cls) {
  const a = RANKS.indexOf(cls[0]), b = RANKS.indexOf(cls[1]), out = [];
  if (cls.length === 2) {
    for (let s1 = 0; s1 < 4; s1++) for (let s2 = s1 + 1; s2 < 4; s2++) out.push([(a << 2) | s1, (b << 2) | s2]);
  } else if (cls[2] === "s") {
    for (let s = 0; s < 4; s++) out.push([(a << 2) | s, (b << 2) | s]);
  } else {
    for (let s1 = 0; s1 < 4; s1++) for (let s2 = 0; s2 < 4; s2++) if (s1 !== s2) out.push([(a << 2) | s1, (b << 2) | s2]);
  }
  return out;
}
const ALL_CLASSES = (() => { const o = []; for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
  const a = RANK_ORDER[i], b = RANK_ORDER[j]; o.push(i === j ? a + b : i < j ? a + b + "s" : b + a + "o"); } return o; })();
const comboCount = h => h.length === 2 ? 6 : h[2] === "s" ? 4 : 12;

// ---- Оценка 7 карт: чем больше число, тем сильнее рука ----
function straightTop(mask) {
  const ext = (mask << 1) | ((mask >> 12) & 1); // бит 0 = туз как единица
  for (let t = 13; t >= 4; t--) if (((ext >> (t - 4)) & 31) === 31) return t - 1;
  return -1;
}
function evaluate(cards) {
  const cnt = new Array(13).fill(0), suitMask = [0, 0, 0, 0], suitCnt = [0, 0, 0, 0];
  let mask = 0;
  for (const c of cards) { const r = c >> 2, s = c & 3; cnt[r]++; suitMask[s] |= 1 << r; suitCnt[s]++; mask |= 1 << r; }
  const B = 15; // основание для упаковки кикеров
  const pack = (cat, ks) => { let v = cat; for (let i = 0; i < 5; i++) v = v * B + (ks[i] ?? 0); return v; };
  for (let s = 0; s < 4; s++) if (suitCnt[s] >= 5) {
    const st = straightTop(suitMask[s]);
    if (st >= 0) return pack(8, [st]);
    const ks = []; for (let r = 12; r >= 0 && ks.length < 5; r--) if (suitMask[s] >> r & 1) ks.push(r);
    var flush = pack(5, ks);
  }
  let quad = -1, trips = [], pairs = [], singles = [];
  for (let r = 12; r >= 0; r--) {
    if (cnt[r] === 4) quad = r; else if (cnt[r] === 3) trips.push(r); else if (cnt[r] === 2) pairs.push(r); else if (cnt[r] === 1) singles.push(r);
  }
  if (quad >= 0) { let k = -1; for (let r = 12; r >= 0; r--) if (r !== quad && cnt[r]) { k = r; break; } return pack(7, [quad, k]); }
  if (trips.length && (trips.length > 1 || pairs.length)) {
    const p = trips.length > 1 ? Math.max(trips[1], pairs[0] ?? -1) : pairs[0];
    return pack(6, [trips[0], p]);
  }
  if (flush !== undefined) return flush;
  const st = straightTop(mask);
  if (st >= 0) return pack(4, [st]);

    const k = Math.max(pairs[2] ?? -1, singles[0] ?? -1);
    return pack(2, [pairs[0], pairs[1], k]);
  }
  if (pairs.length) return pack(1, [pairs[0], ...singles.slice(0, 3)]);

function dockDone(d) {
  const alive = L.active(H), P = L.pot(H);

    <div class="who"><span>${H.board.length ? "Раздача закрыта" : "Префлоп закрыт"} · банк ${P}${pots.length > 1 ? ` (${pots.length} банка)` : ""}</span><b>${head}</b></div>
    ${needRes ? `<div class="row"><button type="button" class="big b-raise" id="dW">Выиграл<small>+${payouts([HERO])[HERO] - invested}</small></button><button type="button" class="big b-call" id="dP">Делёж</button><button type="button" class="big b-hot" id="dL">Проиграл<small>−${invested}</small></button></div>` : ""}

    ${shown ? `<div class="note" style="font-size:13px;color:var(--muted)">Вскрытие: ${shown}</div>` : ""}
    <div class="row"><button type="button" class="small" id="dS">Карты соперника</button><button type="button" class="small" id="dU" ${undoStack.length ? "" : "disabled"}>Отменить</button></div>
    <button type="button" class="big b-call" id="dN" style="flex:none;height:56px">Следующая раздача →</button>`;
  if ($("dW")) $("dW").onclick = () => { setResult("win", [HERO]); render(); };
  if ($("dL")) $("dL").onclick = () => opps.length === 1 ? (setResult("lose", [opps[0]]), render()) : chooseWinner("lose", opps);
  if ($("dP")) $("dP").onclick = () => opps.length === 1 ? (setResult("split", [HERO, opps[0]]), render()) : chooseWinner("split", opps);
  if ($("dWho")) $("dWho").onclick = () => chooseWinner("fold", opps);

const cName2 = c => (E.RANKS[E.cRank(c)] === "T" ? "10" : E.RANKS[E.cRank(c)]) + E.SUITS[E.cSuit(c)];
function seatName(i) { const slot = occ()[i], nm = (S.slotNames || [])[slot]; return nm ? `${nm} (${L.posInfo(S.n, H.dealer, i).id})` : L.posInfo(S.n, H.dealer, i).id; }
// полная запись раздачи и обновление стеков соперников

    const known = H.pay ? H.pay[i] : (H.folded[i] ? 0 : null);
    if (known === null) return; // исход неизвестен — стек не трогаем
    S.slotStacks[slot] = Math.max(0, H.start[i] - L.totalIn(H, i) + known);

  save();
  const rec = { v: 2, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), sid: S.sid, no: S.handNo, t: Date.now(),
    n: S.n, sb: S.sb, bb: S.bb, profile: S.profile, dealer: H.dealer, hero: HERO,

    pos: L.posInfo(S.n, H.dealer, HERO).id, actions: H.actions.map(a => ({ seat: a.seat, type: a.type, to: a.to, check: !!a.check, street: a.street || 0 })),

  const cr = $("aC");

    const b = document.createElement("button"); b.type = "button"; b.className = "chip " + c; b.dataset.v = v;

// привычные ставки игрока по истории: самая частая сумма его рейза на этой улице
function habitOf(seat) {
  const nm = S.slotNames[occ()[seat]]; if (!nm) return null;
  const c = {};
  HIST.forEach(h => { const i = h.seats.findIndex(s => s.name === nm); if (i < 0) return;
    h.actions.filter(a => a.seat === i && a.type === "raise" && (a.street || 0) === H.street).forEach(a => { c[a.to] = (c[a.to] || 0) + 1; }); });
  const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return best && best[1] >= 2 ? { name: nm, to: +best[0] } : null;
}
function openBet(seat, recAmt, viaAct) {
  const p = L.posInfo(S.n, H.dealer, seat);
  const max = L.stackLeft(H, seat), min = Math.min(Math.max(L.minRaiseTo(H), S.bb), max);
  const isBet = H.street > 0 && H.currentBet === 0;
  const learned = Object.entries(QUICK).sort((a, b) => b[1] - a[1]).map(x => +x[0]).filter(v => v >= min && v <= max).slice(0, 4).sort((a, b) => a - b);
  const quick = [];
  if (recAmt) quick.push({ label: `Совет ${recAmt}`, value: recAmt });
  const hb = seat !== HERO ? habitOf(seat) : null;
  if (hb && hb.to >= min && hb.to <= max) quick.push({ label: `Обычно ${hb.to}`, value: hb.to });
  const lastR = [...H.actions].reverse().find(a => a.type === "raise" && (a.street || 0) === H.street);
  const prevHand = HIST[0] && [...HIST[0].actions].find(a => a.type === "raise" && !a.street);
  if (!lastR && prevHand && prevHand.to >= min && prevHand.to <= max && H.street === 0) quick.push({ label: `Как в прошлой ${prevHand.to}`, value: prevHand.to });
  learned.filter(v => !quick.some(q => (q.value ?? q) === v)).forEach(v => quick.push(v));
  const P = L.pot(H), r5 = x => Math.max(S.bb, Math.round(x / 5) * 5);
  if (isBet) { [["⅓ банка", P / 3], ["½ банка", P / 2], ["¾ банка", P * 0.75], ["Банк", P]].forEach(([l, v]) => quick.push({ label: l, value: Math.min(max, r5(v)) })); }
  else if (H.currentBet > S.bb) quick.push({ label: "×3", value: Math.min(max, r5(H.currentBet * 3)) });
  quick.push({ label: "Олл-ин", value: max });
  amountPad({ title: isBet ? `${seat === HERO ? "Твоя ставка" : "Ставка " + p.id}` : `${seat === HERO ? "Твой рейз" : "Рейз " + p.id} до…`, initial: recAmt || 0, min, max, confirmLabel: isBet ? "Ставка" : "Рейз до", quick,
    onOk: v => viaAct ? actAt(seat, "raise", v) : doAct(seat, "raise", v) });
}

let REP = { tab: "session", scope: "session" };
const norm = a => a === "allin" ? "raise" : a === "check" ? "call" : a;
const RESW = { "split": "делёж", "win": "выиграл", "win-pre": "забрал префлоп", "lose": "проиграл", "fold": "сбросил", "unknown": "без итога" };
const sgn = x => (x > 0 ? "+" : "") + x;
const money = x => `<span style="color:${x > 0 ? "var(--raise)" : x < 0 ? "var(--hot)" : "var(--muted)"}">${sgn(x)}</span>`;
function eqCache(h) {
  // эквити героя префлоп против показанных карт соперников (только тех, кто не сбросил)
  if (h._eq !== undefined) return h._eq;
  const opp = Object.entries(h.show || {}).filter(([s]) => !h.folded[+s]).map(([, c]) => c);
  if (!opp.length || h.cards.length !== 2 || h.res === "fold") return (h._eq = null);
  // точные руки соперников: диапазон из одной комбинации
  const used = new Set(h.cards); let total = 0, n = 0;
  for (let t = 0; t < 3000; t++) {
    const deck = []; const block = new Set([...h.cards, ...opp.flat()]);
    for (let c = 0; c < 52; c++) if (!block.has(c)) deck.push(c);
    for (let i = 0; i < 5; i++) { const j = i + ((Math.random() * (deck.length - i)) | 0); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const board = deck.slice(0, 5), me = E.evaluate([...h.cards, ...board]);
    let best = true, ties = 1;
    for (const o of opp) { const v = E.evaluate([...o, ...board]); if (v > me) { best = false; break; } if (v === me) ties++; }
    if (best) total += 1 / ties; n++;
  }
  return (h._eq = total / n);
}
function stackChart(hs) {
  const pts = [0]; hs.slice().reverse().forEach(h => pts.push(pts[pts.length - 1] + h.delta));
  if (pts.length < 2) return `<div class="note">График появится после первых раздач.</div>`;
  const W = 340, Hh = 120, mn = Math.min(0, ...pts), mx = Math.max(0, ...pts), rg = mx - mn || 1;
  const X = i => 8 + i / (pts.length - 1) * (W - 16), Y = v => 8 + (mx - v) / rg * (Hh - 16);
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto" role="img" aria-label="Изменение стека по раздачам">
    <line x1="8" x2="${W - 8}" y1="${Y(0)}" y2="${Y(0)}" stroke="#26302c" stroke-dasharray="3 4"/>
    <polyline fill="none" stroke="${last >= 0 ? "#38d47c" : "#ff5f63"}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>
    <circle cx="${X(pts.length - 1)}" cy="${Y(last)}" r="4" fill="${last >= 0 ? "#38d47c" : "#ff5f63"}"/>
    <text x="${W - 8}" y="${Math.max(14, Y(last) - 8)}" text-anchor="end" fill="#eef3f0" font-size="12" font-family="JetBrains Mono, monospace">${sgn(last)}</text>
    <text x="8" y="${Hh - 2}" fill="#8d9a94" font-size="10" font-family="JetBrains Mono, monospace">раздача 1</text>
    <text x="${W - 8}" y="${Hh - 2}" text-anchor="end" fill="#8d9a94" font-size="10" font-family="JetBrains Mono, monospace">${pts.length - 1}</text></svg>`;
}
function groupTable(rows, head) {
  if (!rows.length) return `<div class="note">Пока нет данных.</div>`;
  return `<div class="list">${rows.map(r => `<div class="li"><span><b>${r.k}</b></span><span class="m">${r.sub}</span><span style="font:700 14px var(--mono)">${money(r.v)}</span></div>`).join("")}</div>`;
}

    ${body}
    <button type="button" class="small" id="rX" style="flex:none">Отправить данные для разбора с Claude</button><div class="note" id="rXn"></div>`);
  document.querySelectorAll(".sheet [data-sc]").forEach(b => b.onclick = () => { REP.scope = b.dataset.sc; openReport(); });
  document.querySelectorAll(".sheet [data-tb]").forEach(b => b.onclick = () => { REP.tab = b.dataset.tb; openReport(); });
  document.querySelectorAll(".sheet [data-h]").forEach(b => b.onclick = () => openHand(b.dataset.h));
  if ($("rSum")) $("rSum").onclick = openSummary;
  $("rX").onclick = async () => {
    const data = JSON.stringify({ exported: new Date().toISOString(), session: { sb: S.sb, bb: S.bb, buyin: S.buyin, buyinByn: S.buyinByn, invested: S.invested, myStack: S.myStack, profile: S.profile }, hands: hs.map(({ _eq, ...h }) => ({ ...h, cards: h.cards.map(cName2), board: (h.board || []).map(cName2), show: Object.fromEntries(Object.entries(h.show || {}).map(([k, v]) => [k, v.map(cName2)])) })) });
    const fallback = () => { $("rXn").innerHTML = `Скопируй вручную:<textarea style="width:100%;height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:11px var(--mono)" readonly>${data.replace(/</g, "&lt;")}</textarea>`; const ta = $("rXn").querySelector("textarea"); ta.focus(); ta.select(); };
    const name = `poker_${new Date().toISOString().slice(0, 10)}.json`;
    // на iPhone: системное меню «Поделиться» — Почта, Telegram, Заметки, Файлы
    try {
      if (navigator.share) {
        const file = typeof File !== "undefined" ? new File([data], name, { type: "application/json" }) : null;
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: "Покер: раздачи" });
        else await navigator.share({ title: "Покер: раздачи", text: data });
        $("rXn").textContent = `Отправлено: ${hs.length} раздач.`; return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { navigator.clipboard.writeText(data).then(() => { $("rXn").textContent = `Скопировано: ${hs.length} раздач. Вставь в чат с Claude.`; }, fallback); } catch (e) { fallback(); }
  };
}
// ---------- итог вечера ----------
function openSummary() {
  const hs = HIST.filter(h => h.sid === S.sid);
  const res = S.myStack - S.invested;
  const mins = Math.max(1, Math.round((Date.now() - (S.sessionStart || Date.now())) / 60000));
  const dur = mins >= 60 ? `${Math.floor(mins / 60)} ч ${mins % 60} мин` : `${mins} мин`;
  const best = hs.reduce((a, h) => !a || h.delta > a.delta ? h : a, null), worst = hs.reduce((a, h) => !a || h.delta < a.delta ? h : a, null);
  const kinds = {};
  hs.forEach(h => h.dec.filter(x => norm(x.rec) !== norm(x.me)).forEach(x => {
    const k = `${STREET[x.street || 0]}: совет «${VERB[x.rec]}», ты «${VERB[x.me]}»`;
    (kinds[k] = kinds[k] || { v: 0, c: 0, ex: [] }); kinds[k].v += h.delta; kinds[k].c++; if (kinds[k].ex.length < 3) kinds[k].ex.push(h.cls);
  }));
  const dev = Object.entries(kinds).sort((a, b) => a[1].v - b[1].v).slice(0, 3);
  const decs = hs.flatMap(h => h.dec), fol = decs.filter(x => norm(x.rec) === norm(x.me)).length;
  const vp = hs.filter(h => h.dec.some(x => !x.street && ["call", "raise", "allin"].includes(x.me))).length;
  const line = h => h ? `<b>${h.cls}</b> · ${h.pos}${h.board && h.board.length ? " · " + h.board.map(cName2).join(" ") : ""} · ${money(h.delta)}` : "—";
  const txt = [`Итог вечера: ${res >= 0 ? "+" : ""}${byn(res)} BYN (${res >= 0 ? "+" : ""}${res} фишек)`, `${hs.length} раздач за ${dur}, играл ${hs.length ? Math.round(vp / hs.length * 100) : 0}% рук, по совету ${decs.length ? Math.round(fol / decs.length * 100) : 0}% решений`,
    best ? `Лучшая: ${best.cls} ${best.pos} ${sgn(best.delta)}` : "", worst ? `Худшая: ${worst.cls} ${worst.pos} ${sgn(worst.delta)}` : "",
    ...dev.map(([k, x]) => `${k} — ${x.c} раз, ${sgn(x.v)} фишек`)].filter(Boolean).join("\n");
  sheet(`<h3>Итог вечера</h3>
    <div style="text-align:center"><div class="res ${res >= 0 ? "pos" : "neg"}">${res >= 0 ? "+" : ""}${byn(res)} BYN</div><div class="note">${res >= 0 ? "+" : ""}${res} фишек · ${hs.length} раздач · ${dur}</div></div>
    ${stackChart(hs)}
    <div class="kpis"><div class="kpi"><span>Играл рук</span><b>${hs.length ? Math.round(vp / hs.length * 100) : 0}%</b></div><div class="kpi"><span>По совету</span><b>${decs.length ? Math.round(fol / decs.length * 100) : 0}%</b></div><div class="kpi"><span>Докупки</span><b>${Math.round((S.invested - S.buyin) / S.buyin)}</b></div></div>
    <div class="detail"><div class="ln"><span>Лучшая раздача</span><span>${line(best && best.delta > 0 ? best : null)}</span></div><div class="ln"><span>Худшая раздача</span><span>${line(worst && worst.delta < 0 ? worst : null)}</span></div></div>
    <h3 style="font-size:15px">Главные отклонения от совета</h3>
    ${dev.length ? `<div class="list">${dev.map(([k, x], n) => `<div class="li"><span class="m">${n + 1}</span><span>${k}<br><span class="m">${x.c} раз · ${x.ex.join(", ")}</span></span><span style="font:700 13px var(--mono)">${money(x.v)}</span></div>`).join("")}</div>` : `<div class="note">Ты играл строго по совету.</div>`}
    <div class="row"><button type="button" class="small" id="smC">Скопировать итог</button><button type="button" class="small" id="smR">Полный отчёт</button></div><div class="note" id="smN"></div>`);
  $("smR").onclick = () => { REP.tab = "session"; REP.scope = "session"; openReport(); };
  $("smC").onclick = () => { try { navigator.clipboard.writeText(txt).then(() => $("smN").textContent = "Скопировано.", () => $("smN").textContent = txt); } catch (e) { $("smN").textContent = txt; } };
}
// карточка раздачи: детали, правка итога, карты соперников задним числом
function openHand(id) {
  const h = HIST.find(x => x.id === id); if (!h) return;
  const nm = i => h.seats[i].name ? `${h.seats[i].name} (${h.seats[i].pos})` : h.seats[i].pos;
  let raises = 0;
  let st = -1;
  const acts = h.actions.map(a => { const s = a.street || 0; let pre = ""; if (s !== st) { st = s; raises = 0; pre = `<br><b>${STREET[s]}:</b> `; }
    const w = a.type === "fold" ? "фолд" : a.type === "raise" ? (s ? (++raises === 1 ? "ставка " : "рейз до ") : (++raises === 1 ? "рейз " : raises === 2 ? "3-бет " : "4-бет ")) + a.to : a.check ? "чек" : (raises || s ? "колл " : "лимп ") + a.to;
    return pre + `${a.seat === h.hero ? "<b>ты</b>" : nm(a.seat)}: ${w}`; }).join(" · ").replace(/^<br>/, "");
  const decs = h.dec.map(x => `${STREET[x.street || 0]}: совет ${VERB[x.rec]}${["raise", "allin"].includes(x.rec) ? " " + x.amt : ""} → ты ${VERB[x.me]}`).join("; ");
  sheet(`<h3>Раздача #${h.no} · ${h.pos}</h3>
    <div class="hc" style="justify-content:center">${h.cards.map(cardHTML).join("")}</div>
    ${h.board && h.board.length ? `<div class="hc board" style="justify-content:center">${h.board.map(cardHTML).join("")}</div>` : ""}
    <div class="detail">
      <div class="ln"><span>Стол</span><span>${h.n} игр. · ${h.sb}/${h.bb}</span></div>
      <div class="ln"><span>Итог</span><span>${RESW[h.res] || ""} · ${money(h.delta)} · ${byn(h.delta)} BYN</span></div>
      <div class="ln"><span>Решения</span><span>${decs || "—"}</span></div>
    </div>
    <div class="note" style="font-size:13px;color:var(--muted)">${acts || "Без действий"}</div>
    <div class="detail">${Object.entries(h.show || {}).map(([s, c]) => `<div class="ln"><span>${nm(+s)}</span><span>${c.map(cName2).join(" ")}</span></div>`).join("")}</div>
    <div class="row"><button type="button" class="small" id="hW">Выиграл…</button><button type="button" class="small" id="hL">Проиграл…</button></div>
    <button type="button" class="small" id="hS" style="flex:none">Добавить карты соперника</button>
    <button type="button" class="small" id="hB" style="flex:none">← К отчёту</button>`);
  const saveH = () => { delete h._eq; store.set("pk2_hist", HIST); };
  const fix = res => amountPad({ title: res === "win" ? "Чистый выигрыш" : "Сколько проиграл", initial: Math.abs(h.delta), min: 0, max: 99999, confirmLabel: "Записать", quick: [],
    onOk: v => { const nd = res === "win" ? v : -v; if (h.sid === S.sid) { S.myStack += nd - h.delta; save(); } h.delta = nd; h.res = res; saveH(); render(); openHand(id); } });
  $("hW").onclick = () => fix("win"); $("hL").onclick = () => fix("lose");
  $("hB").onclick = () => openReport();
  $("hS").onclick = () => {
    sheet(`<h3>Чьи карты?</h3><div class="list">${h.seats.map((s, i) => i === h.hero ? "" : `<button type="button" class="li" data-i="${i}" style="text-align:left"><span class="m">${h.folded[i] ? "фолд" : "в игре"}</span><span><b>${nm(i)}</b></span><span class="m">${h.show && h.show[i] ? h.show[i].map(cName2).join(" ") : "→"}</span></button>`).join("")}</div>`);
    document.querySelectorAll(".sheet [data-i]").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, used = [...h.cards, ...(h.board || []), ...Object.entries(h.show || {}).filter(([k]) => +k !== i).flatMap(([, v]) => v)];
      cardSheet(`Карты: ${nm(i)}`, used, c => { h.show = h.show || {}; h.show[i] = c; saveH(); openHand(id); });
    });
  };
}

$("btnSess").onclick = openSession;
$("btnHist").onclick = () => openReport();
$("btnSeat").onclick = () => EDIT ? (EDIT = false, startHand()) : openEdit();
startHand();
if (firstRun) { S.handNo = 0; openEdit(); }
</script>
